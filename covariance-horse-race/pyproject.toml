[project]
name = "covariance-horse-race"
version = "1.0.0"
description = "Out-of-sample evaluation of covariance forecasts on a century of daily US portfolio returns, with Model Confidence Set inference."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian Wachira" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "numba>=0.61",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0.2",
    "typer>=0.12",
    "httpx>=0.27",
    "jinja2>=3.1.4",
    "matplotlib>=3.9",
]

[project.scripts]
chr = "covariance_horse_race.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covariance_horse_race"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "NPY", "PD", "PT", "C4", "PL"]
ignore = [
    "PLR0913",  # estimator and engine signatures carry explicit research parameters
    "PLR2004",  # tolerances in tests are named inline where they are asserted
    "N803",     # matrix arguments follow the paper notation (X, S, H)
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["numba", "numba.*", "scipy", "scipy.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running statistical recovery tests"]

[tool.coverage.run]
source = ["covariance_horse_race"]
branch = true
